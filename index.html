<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101713">
  <title>铁巢重炮 · 仰角速算</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b100d;
      --panel: #121a15;
      --panel-2: #17211b;
      --line: #2e3d32;
      --text: #f1f3e8;
      --muted: #9da99d;
      --accent: #e6b84f;
      --accent-2: #ffe39a;
      --ok: #85c691;
      --danger: #e47b67;
      --radius: 20px;
      --shadow: 0 24px 70px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(104, 137, 83, .14), transparent 34rem),
        linear-gradient(160deg, #0c120e 0%, #090d0b 100%);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .035;
      background-image: repeating-linear-gradient(0deg, transparent 0 3px, #fff 4px);
    }

    button, input { font: inherit; }

    .shell {
      width: min(1060px, calc(100% - 32px));
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0 max(44px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .24em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    .rule {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      line-height: 1.8;
    }

    .rule strong { color: var(--accent-2); font-weight: 700; }

    .calculator {
      display: grid;
      grid-template-columns: minmax(280px, .8fr) minmax(0, 1.2fr);
      gap: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(24, 34, 27, .96), rgba(15, 22, 18, .98));
      box-shadow: var(--shadow);
    }

    .input-panel {
      display: flex;
      flex-direction: column;
      min-height: 438px;
      padding: 24px;
    }

    .section-label {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    #distance {
      width: 100%;
      min-height: 74px;
      padding: 12px 54px 12px 18px;
      border: 1px solid #52604f;
      border-radius: 15px;
      outline: none;
      color: var(--text);
      background: #0c120e;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      transition: border-color .2s, box-shadow .2s;
    }

    #distance:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(230, 184, 79, .13);
    }

    .input-unit {
      position: absolute;
      right: 18px;
      top: 50%;
      color: var(--muted);
      font-size: 13px;
      transform: translateY(-50%);
    }

    .hint, .error {
      min-height: 42px;
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
    }

    .hint { color: var(--muted); }
    .error { color: var(--danger); }

    .quick-values {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .quick-values button {
      min-height: 43px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: #cbd2c7;
      background: rgba(255, 255, 255, .025);
      cursor: pointer;
    }

    .quick-values button:hover,
    .quick-values button:focus-visible {
      border-color: #6f7d6d;
      color: var(--text);
    }

    .limit-note {
      margin-top: auto;
      padding-top: 22px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .limit-note span { color: var(--ok); }

    .output-panel { padding: 24px; }

    .highlights {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    .highlight {
      position: relative;
      min-height: 142px;
      overflow: hidden;
      padding: 18px;
      border: 1px solid #3b493c;
      border-radius: 16px;
      background: rgba(255, 255, 255, .025);
    }

    .highlight.primary {
      border-color: rgba(230, 184, 79, .55);
      background: linear-gradient(145deg, rgba(230, 184, 79, .16), rgba(230, 184, 79, .035));
    }

    .highlight-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .highlight-value {
      margin-top: 17px;
      font-size: clamp(25px, 4vw, 34px);
      font-weight: 850;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .primary .highlight-value { color: var(--accent-2); }
    .highlight-time { color: var(--ok); font-size: .58em; white-space: nowrap; }

    .highlight-meta {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 12px var(--ok);
    }

    .results-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .results-head .section-label { margin: 0; }

    #count {
      color: var(--muted);
      font-size: 12px;
    }

    .result-list { display: grid; gap: 8px; }

    .result-row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 8px 13px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: rgba(255, 255, 255, .025);
    }

    .result-row.minimum { border-color: rgba(230, 184, 79, .38); }

    .charge-badge {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 9px;
      color: #11160f;
      background: #aab5a6;
      font-weight: 900;
    }

    .minimum .charge-badge { background: var(--accent); }

    .row-name { font-size: 14px; font-weight: 700; }
    .row-note { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .angle { color: var(--text); font-size: 20px; font-weight: 850; font-variant-numeric: tabular-nums; }
    .metrics { text-align: right; }
    .flight-time { margin-top: 2px; color: var(--ok); font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; }

    .empty {
      display: grid;
      min-height: 160px;
      padding: 24px;
      place-items: center;
      border: 1px dashed #465346;
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    footer {
      margin-top: 18px;
      color: #748075;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 22px, 560px); padding-top: 22px; }
      header { display: block; margin-bottom: 18px; }
      .rule { margin-top: 12px; text-align: left; }
      .calculator { grid-template-columns: 1fr; }
      .input-panel { min-height: auto; padding: 18px; }
      .output-panel { padding: 18px; }
      .limit-note { margin-top: 8px; }
    }

    @media (max-width: 390px) {
      .highlights { grid-template-columns: 1fr; }
      .highlight { min-height: 118px; }
      .highlight-value { margin-top: 12px; }
      .result-row { grid-template-columns: 38px 1fr auto; gap: 8px; padding-inline: 10px; }
      .angle { font-size: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

    /* High-density field layout */
    .shell { padding-block: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-bottom)); }
    header { margin-bottom: 14px; }
    h1 { font-size: clamp(24px, 4vw, 34px); }
    .calculator { grid-template-columns: 250px minmax(0, 1fr); gap: 12px; }
    .input-panel { min-height: 0; padding: 16px; }
    .input-wrap { margin: 0; }
    #distance { min-height: 62px; }
    .hint { display: none; }
    .error { min-height: 0; margin-top: 8px; }
    .output-panel { padding: 16px; }
    .highlights { gap: 8px; margin-bottom: 12px; }
    .highlight { min-height: 92px; padding: 12px 14px; }
    .highlight-value { margin-top: 10px; font-size: clamp(22px, 3vw, 28px); }
    .highlight-meta { display: none; }
    .results-head { margin-bottom: 7px; }
    .result-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .result-row { min-height: 48px; padding: 6px 10px; }
    .row-note { display: none; }
    .empty { grid-column: 1 / -1; min-height: 112px; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 16px, 560px); padding-top: max(10px, env(safe-area-inset-top)); }
      header { margin-bottom: 9px; }
      h1 { font-size: 22px; letter-spacing: -.02em; }
      .calculator { display: block; }
      .panel { border-radius: 14px; box-shadow: 0 12px 34px rgba(0, 0, 0, .24); }
      .input-panel { display: block; margin-bottom: 8px; padding: 9px; }
      label { margin: 0 0 6px 2px; font-size: 12px; color: var(--muted); }
      #distance { min-height: 52px; padding-block: 6px; border-radius: 10px; font-size: 27px; }
      .error { padding-inline: 2px; font-size: 11px; line-height: 1.35; }
      .output-panel { padding: 9px; }
      .highlights { margin-bottom: 8px; }
      .highlight { min-height: 72px; padding: 9px 10px; border-radius: 10px; }
      .highlight-title { font-size: 10px; }
      .highlight-value { margin-top: 7px; font-size: clamp(19px, 5.5vw, 24px); }
      .results-head { margin: 0 1px 6px; }
      .results-head .section-label { font-size: 10px; letter-spacing: .1em; }
      #count { font-size: 10px; }
      .result-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
      .result-row { grid-template-columns: 30px 1fr auto; min-height: 43px; gap: 6px; padding: 4px 7px; border-radius: 8px; }
      .charge-badge { width: 28px; height: 28px; border-radius: 7px; font-size: 13px; }
      .row-name { font-size: 12px; white-space: nowrap; }
      .angle { font-size: 17px; }
      .empty { min-height: 90px; font-size: 13px; }
    }

    @media (max-width: 350px) {
      .result-row { grid-template-columns: 26px 1fr; }
      .charge-badge { width: 25px; height: 25px; }
      .result-row > div:nth-child(2) { display: none; }
      .angle { text-align: right; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>铁巢重炮仰角速算</h1>
    </header>

    <section class="calculator" aria-label="仰角计算器">
      <div class="panel input-panel">
        <label for="distance">目标距离</label>
        <div class="input-wrap">
          <input id="distance" type="number" min="0.01" max="9999" step="0.1" inputmode="decimal" placeholder="例如 12.5" autocomplete="off">
          <span class="input-unit">km</span>
        </div>
        <p id="message" class="hint" aria-live="polite"></p>
      </div>

      <div class="panel output-panel">
        <div class="highlights">
          <article class="highlight primary">
            <div class="highlight-title">最少装药方案</div>
            <div id="minimumValue" class="highlight-value">等待输入</div>
            <div id="minimumMeta" class="highlight-meta">—</div>
          </article>
          <article class="highlight">
            <div class="highlight-title">6 包装药方案</div>
            <div id="sixValue" class="highlight-value">等待输入</div>
            <div id="sixMeta" class="highlight-meta">—</div>
          </article>
        </div>

        <div class="results-head">
          <p class="section-label">全部可用方案</p>
          <span id="count">0 个结果</span>
        </div>
        <div id="results" class="result-list">
          <div class="empty">输入目标距离<br>计算结果将在这里显示</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const MAX_ANGLE = 60;
    const MAX_CHARGES = 6;
    const FLIGHT_TIME_COEFF = { 1: 4.65, 2: 3.80, 3: 2.62, 4: 1.85, 5: 1.55, 6: 1.40 };

    const distanceInput = document.querySelector('#distance');
    const message = document.querySelector('#message');
    const minimumValue = document.querySelector('#minimumValue');
    const minimumMeta = document.querySelector('#minimumMeta');
    const sixValue = document.querySelector('#sixValue');
    const sixMeta = document.querySelector('#sixMeta');
    const results = document.querySelector('#results');
    const count = document.querySelector('#count');

    const formatAngle = value => `${Number(value).toFixed(2)}°`;
    const formatFlightTime = (distance, charges) => `${Math.floor(distance * FLIGHT_TIME_COEFF[charges] + 0.5)}s`;

    function resetOutput() {
      minimumValue.textContent = '等待输入';
      minimumMeta.textContent = '—';
      sixValue.textContent = '等待输入';
      sixMeta.textContent = '—';
      count.textContent = '0 个结果';
      results.innerHTML = '<div class="empty">输入目标距离<br>计算结果将在这里显示</div>';
    }

    function calculate() {
      const raw = distanceInput.value.trim();
      if (!raw) {
        message.className = 'hint';
        message.textContent = '输入距离后，将即时筛选仰角不超过 60° 的装药方案。';
        resetOutput();
        return;
      }

      const distance = Number(raw);
      if (!Number.isFinite(distance) || distance <= 0) {
        message.className = 'error';
        message.textContent = '请输入大于 0 的有效距离。';
        resetOutput();
        return;
      }

      const solutions = Array.from({ length: MAX_CHARGES }, (_, index) => {
        const charges = index + 1;
        return { charges, angle: (12 / charges) * distance };
      }).filter(item => item.angle <= MAX_ANGLE + Number.EPSILON);

      if (!solutions.length) {
        message.className = 'error';
        message.textContent = `距离 ${distance} 超出可计算范围：6 包装药所需仰角仍超过 60°。`;
        minimumValue.textContent = '无可用方案';
        minimumMeta.textContent = '需要超过 6 包装药';
        sixValue.innerHTML = `超出上限 <span class="highlight-time">${formatFlightTime(distance, 6)}</span>`;
        sixMeta.textContent = `所需 ${formatAngle((12 / 6) * distance)}`;
        count.textContent = '0 个结果';
        results.innerHTML = '<div class="empty">所有装药数量均超过最大仰角 60°<br>请缩短距离后重试</div>';
        return;
      }

      message.className = 'hint';
      message.textContent = `距离 ${distance}：已排除 ${MAX_CHARGES - solutions.length} 个超限方案。`;

      const minimum = solutions[0];
      const six = solutions.find(item => item.charges === 6);

      minimumValue.innerHTML = `${minimum.charges} 包 · ${formatAngle(minimum.angle)} <span class="highlight-time">${formatFlightTime(distance, minimum.charges)}</span>`;
      minimumMeta.innerHTML = '<span class="status-dot"></span>满足 60° 上限的最少装药数';

      if (six) {
        sixValue.innerHTML = `6 包 · ${formatAngle(six.angle)} <span class="highlight-time">${formatFlightTime(distance, 6)}</span>`;
        sixMeta.innerHTML = '<span class="status-dot"></span>最大装药数量';
      } else {
        sixValue.textContent = '超出上限';
        sixMeta.textContent = `所需 ${formatAngle((12 / 6) * distance)}`;
      }

      count.textContent = `${solutions.length} 个结果`;
      results.innerHTML = solutions.map(item => `
        <div class="result-row ${item.charges === minimum.charges ? 'minimum' : ''}">
          <div class="charge-badge">${item.charges}</div>
          <div>
            <div class="row-name">${item.charges} 包装药</div>
          </div>
          <div class="metrics">
            <div class="angle">${formatAngle(item.angle)}</div>
            <div class="flight-time">${formatFlightTime(distance, item.charges)}</div>
          </div>
        </div>
      `).join('');
    }

    distanceInput.addEventListener('input', calculate);
    document.querySelectorAll('[data-value]').forEach(button => {
      button.addEventListener('click', () => {
        distanceInput.value = button.dataset.value;
        calculate();
        distanceInput.focus();
      });
    });
  </script>
</body>
</html>
