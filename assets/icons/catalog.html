<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>铁巢炮控 SVG 素材库</title>
  <style>
    :root{color-scheme:dark;--bg:#090e0b;--panel:#121a15;--line:#334238;--text:#edf2e8;--muted:#97a298;--accent:#e6b84f}
    *{box-sizing:border-box}body{margin:0;padding:28px;color:var(--text);background:var(--bg);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px}h1,h2,p{margin:0}h1{font-size:28px}p{color:var(--muted);font-size:13px}section{margin-top:28px}h2{margin-bottom:12px;color:var(--accent);font-size:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}figure{display:grid;grid-template-rows:82px auto;margin:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}img{width:72px;height:72px;margin:auto;object-fit:contain}.stacked-preview{position:relative;width:72px;height:72px;margin:auto}.stacked-preview .base-icon{position:absolute;left:8px;bottom:0;width:56px;height:56px}.stacked-preview .modifier-icon{position:absolute;left:8px;top:0;width:56px;height:22px}figcaption{font-size:12px;text-align:center}code{display:block;margin-top:5px;color:var(--muted);font-size:9px;word-break:break-all}@media(max-width:520px){body{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}p{margin-top:8px}}
  </style>
</head>
<body>
  <header><div><h1>铁巢炮控 SVG 素材库</h1><p>标准化矢量图标 · 可独立引用或通过 SVG sprite 调用</p></div><p>42 个独立素材</p></header>
  <section><h2>单位图例</h2><div class="grid">
      <figure>
        <img src="svg/unit-friendly.svg" alt="友军单位">
        <figcaption>友军单位<code>unit-friendly</code></figcaption>
      </figure>
      <figure>
        <img src="svg/unit-enemy.svg" alt="敌军单位">
        <figcaption>敌军单位<code>unit-enemy</code></figcaption>
      </figure>
      <figure>
        <img src="svg/unit-friendly-infantry.svg" alt="友军步兵">
        <figcaption>友军步兵<code>unit-friendly-infantry</code></figcaption>
      </figure>
      <figure>
        <img src="svg/unit-enemy-infantry.svg" alt="敌军步兵">
        <figcaption>敌军步兵<code>unit-enemy-infantry</code></figcaption>
      </figure>
      <figure>
        <img src="svg/unit-friendly-recon.svg" alt="友军侦察">
        <figcaption>友军侦察<code>unit-friendly-recon</code></figcaption>
      </figure>
      <figure>
        <img src="svg/unit-enemy-recon.svg" alt="敌军侦察">
        <figcaption>敌军侦察<code>unit-enemy-recon</code></figcaption>
      </figure>
      <figure>
        <img src="svg/unit-friendly-artillery.svg" alt="友军炮兵">
        <figcaption>友军炮兵<code>unit-friendly-artillery</code></figcaption>
      </figure>
      <figure>
        <img src="svg/unit-enemy-artillery.svg" alt="敌军炮兵">
        <figcaption>敌军炮兵<code>unit-enemy-artillery</code></figcaption>
      </figure>
      <figure>
        <img src="svg/unit-friendly-mechanized.svg" alt="友军机械化部队">
        <figcaption>友军机械化部队<code>unit-friendly-mechanized</code></figcaption>
      </figure>
      <figure>
        <img src="svg/unit-enemy-mechanized.svg" alt="敌军机械化部队">
        <figcaption>敌军机械化部队<code>unit-enemy-mechanized</code></figcaption>
      </figure>
    </div></section>
<section><h2>地图符号</h2><div class="grid">
      <figure>
        <img src="svg/map-reference-point.svg" alt="参考点">
        <figcaption>参考点<code>map-reference-point</code></figcaption>
      </figure>
    </div></section>
<section><h2>单位上方修饰符</h2><div class="grid">
      <figure>
        <div class="stacked-preview"><img class="base-icon" src="svg/unit-enemy-artillery.svg" alt=""><img class="modifier-icon" src="svg/modifier-underground.svg" alt="地下修饰符"></div>
        <figcaption>地下修饰符<code>modifier-underground</code></figcaption>
      </figure>
      <figure>
        <div class="stacked-preview"><img class="base-icon" src="svg/unit-enemy-artillery.svg" alt=""><img class="modifier-icon" src="svg/modifier-high-priority.svg" alt="高优先级修饰符"></div>
        <figcaption>高优先级修饰符<code>modifier-high-priority</code></figcaption>
      </figure>
      <figure>
        <div class="stacked-preview"><img class="base-icon" src="svg/unit-enemy-artillery.svg" alt=""><img class="modifier-icon" src="svg/modifier-building.svg" alt="建筑物修饰符"></div>
        <figcaption>建筑物修饰符<code>modifier-building</code></figcaption>
      </figure>
    </div></section>
